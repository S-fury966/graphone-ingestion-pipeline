# =====================================================================
# MOCKED seed list for the GraphOne entity-resolution assignment (Step 13).
#
# This is a hand-curated, MOCK canonical database of well-known AI companies,
# used only to canonicalize scraped name variants. It is NOT scraped and is not
# authoritative; it exists so the resolver has a stable set of known entities.
#
# Per entry:
#   canonical : the exact official spelling (the output name)
#   domain    : primary registrable domain (used by the domain-match layer)
#   aliases   : realistic MESSY variants a real data source could emit
#               (casing/spacing/hyphens/legal suffixes/punctuation/domains).
#               Aliases are deliberately TIGHT — never a bare generic word that
#               another company could also use ("character", "writer", "scale").
#   products  : optional; 2-3 well-known products, each with its own aliases.
#
# `do_not_merge` (bottom) lists similar-but-DIFFERENT names that must never be
# merged. Reviewed by hand.
# =====================================================================

seed_entities:
